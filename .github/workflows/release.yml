name: Wincast

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Check Go source
        working-directory: go
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l cmd internal)
          if ($unformatted.Count -gt 0) { throw "Run gofmt on: $unformatted" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          go tool mygo vet .
          if ($LASTEXITCODE -ne 0) { throw 'mygo vet failed' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'module verification failed' }
      - name: Package Wincast
        shell: pwsh
        run: |
          ./tools/package-release.ps1
          $config = Get-Content go/mygo.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$($config.version)") { throw 'Tag and mygo.json version differ' }
            if (-not (Test-Path "releases/$env:GITHUB_REF_NAME.md")) { throw 'Write user-facing release notes before tagging' }
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wincast-windows-x64
          path: go/build/release/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wincast-windows-x64
          path: release
      - name: Unpack release assets
        shell: pwsh
        run: Expand-Archive -Path release/*.zip -DestinationPath release/assets
      - name: Publish Wincast
        uses: softprops/action-gh-release@v2
        with:
          name: wincast ${{ github.ref_name }}
          body_path: releases/${{ github.ref_name }}.md
          files: |
            release/*.zip
            release/assets/wincast.exe
            release/assets/wincast Setup *.exe
          fail_on_unmatched_files: true
