name: Release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release
        run: cargo build -p tinycast --release --locked

      - name: Package
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "workspace version missing" }
          $version = $match.Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET=tinycast-$version-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tinycast.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "tinycast-$version-windows-x64.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build.${{ github.run_number }}
          name: Tinycast ${{ env.VERSION }} build ${{ github.run_number }}
          body: |
            Automated Windows x64 build.

            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
          files: |
            ${{ env.ASSET }}
            dist/tinycast.exe
          generate_release_notes: true
